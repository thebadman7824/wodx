# SSH settings for Live. Installed as /etc/ssh/sshd_config.d/10-wodx.conf (the first value read wins,
# so this file overrides the defaults further down sshd_config). ufw already limits SSH to Ben's home address.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
# "local" keeps ssh -L working, which the Setup tunnel needs.
AllowTcpForwarding local
AllowAgentForwarding no
MaxAuthTries 3
AllowUsers root
