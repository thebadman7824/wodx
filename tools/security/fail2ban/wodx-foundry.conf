# fail2ban filter for wodx.online, read from Caddy's JSON access log (/var/log/caddy/wodx-access.log).
# Installed on Live as /etc/fail2ban/filter.d/wodx-foundry.conf.
# Counts requests to the blocked Setup screen and status page (Caddy answers 403), and failed
# logins on /join when Foundry answers them with 401 or 403.
[Definition]
failregex = "remote_ip":"<HOST>".*"uri":"/(setup|api/status)[^"]*".*"status":403
            "remote_ip":"<HOST>".*"method":"POST".*"uri":"/join[^"]*".*"status":40[13]
datepattern = "ts":{EPOCH}
