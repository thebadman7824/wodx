# systemd drop-in for foundry.service on Live. Installed as /etc/systemd/system/foundry.service.d/hardening.conf.
# The unit already sets NoNewPrivileges, ProtectSystem=full and PrivateTmp. This makes the whole file system
# read-only for Foundry except its data folder, hides home folders, and makes new files private to the foundry user.
# Foundry can no longer update itself in place: updates are done by hand after a testbed check.
# Undo: rm /etc/systemd/system/foundry.service.d/hardening.conf && systemctl daemon-reload && systemctl restart foundry
[Service]
ProtectSystem=strict
ReadWritePaths=/opt/foundry/data
ProtectHome=true
UMask=0027
