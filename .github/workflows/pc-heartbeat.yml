# B4700: the PC runner went silent once (14 November 2026, about 17:25Z) with no crash logged and no alert, because
# its alerts come from the runner itself. This checks from outside: every 15 minutes, if a PC runner status issue
# (label pc-status, updated every 2 minutes while its runner lives) or the PC watcher report (label pc-watch, every
# 5 minutes) is more than 15 minutes old, an issue labelled pc-alert says so; it is closed again once the issue moves.
# The coordinator watches pc-alert issues.
# B7290: it used to read only the newest pc-status issue (per_page=1), so with three PCs it watched the newest one
# and missed the Main PC. It now checks each status issue and the watcher report by title.
# Restart on the PC: powershell -ExecutionPolicy Bypass -File <home>\repo\tools\pcq\start-runner.ps1
name: PC runner heartbeat
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check each status issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          alerts=$(gh api "repos/$REPO/issues?labels=pc-alert&state=open&per_page=100" --jq '.[] | "\(.number)\t\(.title)"')
          { gh api "repos/$REPO/issues?labels=pc-status&state=open&per_page=100" --jq '.[] | "\(.updated_at)\t\(.title)"'
            gh api "repos/$REPO/issues?labels=pc-watch&state=open&per_page=100" --jq '.[] | "\(.updated_at)\t\(.title)"'; } |
          while IFS=$'\t' read -r updated title; do
            [ -n "$updated" ] || continue
            # The Main PC's issue keeps its old alert title so an open alert from before this change still matches.
            if [ "$title" = "PC runner status" ]; then TITLE="PC runner alert: the runner is silent"; else TITLE="Heartbeat alert: $title is silent"; fi
            alert=$(printf '%s\n' "$alerts" | awk -F'\t' -v t="$TITLE" '$2 == t {print $1; exit}')
            age=$(( $(date -u +%s) - $(date -u -d "$updated" +%s) ))
            echo "$title: last updated $updated ($age s ago)."
            if [ "$age" -gt 900 ]; then
              if [ -z "$alert" ]; then
                gh api "repos/$REPO/issues" -f title="$TITLE" -f "labels[]=pc-alert" \
                  -f body="The issue \"$title\" has not moved since $updated (over 15 minutes). Its runner or watcher is probably not running, or the PC is off. Restart a runner on its PC with: powershell -ExecutionPolicy Bypass -File <home>\\repo\\tools\\pcq\\start-runner.ps1; the watcher comes back with its scheduled task \"WoDX PC watcher at logon\". This heartbeat closes the issue once it moves again." > /dev/null
                echo "  opened an alert"
              fi
            elif [ -n "$alert" ]; then
              gh api -X PATCH "repos/$REPO/issues/$alert" -f state=closed -f body="Back: \"$title\" moved at $updated." > /dev/null
              echo "  closed alert #$alert"
            fi
          done
